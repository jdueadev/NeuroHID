name: CI

# One check, the same one you run locally: pwsh scripts/check.ps1
# The Linux job runs all of it. Windows and macOS run only the test suite,
# because the lint, docs, dependency and Python checks don't change by OS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYO3_PYTHON: python

jobs:
  check:
    name: Check
    # Pinned, not ubuntu-latest: liblsl ships .debs for jammy and noble only,
    # and ubuntu-latest moving past noble is what turned main red.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: astral-sh/setup-uv@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9,cargo-llvm-cov,cargo-deny
      - name: Install LSL and keyring support
        run: |
          bash ./.github/scripts/install-liblsl-linux.sh
          sudo apt-get install -y dbus-x11 libsecret-1-dev gnome-keyring
      - name: Check
        shell: pwsh
        run: ./scripts/check.ps1 -Coverage

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9
      - name: Set up Python import library
        shell: pwsh
        run: ./.github/scripts/setup-python-lib-windows.ps1
      - name: Test
        run: cargo nextest run --workspace

  test-macos:
    name: Test (macOS)
    if: vars.ENABLE_MACOS != 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9
      - name: Test
        run: cargo nextest run --workspace
